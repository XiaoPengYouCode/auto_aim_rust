[workspace]
members = [
    "lib",
    "app/auto_aim_async",
    "app/ippe_benchmark",
    "app/single_frame_dev",
    "app/comm_test"
]
default-members = ["lib"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["Lu Zhongjin <luzhongjin365@gmail.com>"]
license = "MIT"

[profile.release]
opt-level = 3

[workspace.dependencies]
# base
nalgebra = "0.33.2"
imageproc = "0.25.0"
image = "0.25.6"

# for infer
ndarray = "0.16.1"
ort = { version = "2.0.0-rc.10", features = ["tensorrt", "openvino"] }

# error handle
thiserror = "2.0.12"

# logger
log = "0.4.32"
logforth = { version = "0.30.1", features = ["starter-log", "append-file", "append-async", "layout-text", "filter-rustlog"] }
logforth-append-file = "0.4.0"
logforth-append-async = "0.4.0"
rerun = "0.33.0"

# cfg
toml = "0.9.2"
lazy_static = "1.5.0"
serde = { version = "1.0.219", features = ["derive"] }

# framework
tokio = { version = "1.46.1", features = ["full"] }
tokio-serial = "5.4.5"
chrono = "0.4.41"
notify = "8.0.0"
crossbeam-queue = "0.3.12"

# enum reflect
strum = {version = "0.27.2", features = ["derive"]}
